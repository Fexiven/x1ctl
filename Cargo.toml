[package]
name = "x1ctl"
version = "0.3.0"
edition = "2024"
description = "Linux control daemon and CLI for the Creative Sound Blaster X1 (Super X-Fi, graphic EQ)"
license = "MIT"
repository = "https://github.com/Fexiven/x1ctl"
keywords = ["creative", "sound-blaster", "x1", "super-x-fi", "equalizer"]
categories = ["command-line-utilities", "hardware-support"]
rust-version = "1.85"

[lib]
name = "x1"
path = "src/lib.rs"

[[bin]]
name = "x1d"
path = "src/bin/x1d.rs"

[[bin]]
name = "x1ctl"
path = "src/bin/x1ctl.rs"

[[bin]]
name = "x1-gui"
path = "src/bin/x1-gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:ksni"]

[dependencies]
aes-gcm = "0.10.3"
getrandom = "0.2"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate-miniz"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
blocking = "1"
eframe = { version = "0.36", optional = true }
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }

[profile.release]
lto = true
strip = true
